[workspace]
members = ["bin/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.7"
edition = "2024"
authors = ["longcipher"]
license = "Apache-2.0"
description = "A high-performance static site generator with Typst/Markdown support"
repository = "https://github.com/longcipher/typstify"
homepage = "https://github.com/longcipher/typstify"
readme = "README.md"
keywords = ["static-site", "typst", "markdown", "ssg"]
categories = ["web-programming", "command-line-utilities"]
exclude = ["target", "node_modules", ".rumdl_cache", "tmp"]

[workspace.dependencies]
# Local crates
axum = "0.8.9"
chrono = "0.4.45"
clap = "4.6.1"
color-eyre = "0.6.5"
config = "0.15.25"
notify = "8.2.0"
open = "5.3.6"
pulldown-cmark = "0.13.4"
rayon = "1.12.0"
rss = "2.1.0"
serde = "1.0.228"
serde_json = "1.0.150"
serde_yaml = "0.9.34"
syntect = "5.3.0"
tantivy = "0.26.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.3"
tokio-stream = "0.1.18"
toml = "1.1.2"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
typstify-core = { path = "crates/typstify-core", version = "0.1.5" }
typstify-generator = { path = "crates/typstify-generator", version = "0.1.5" }
typstify-parser = { path = "crates/typstify-parser", version = "0.1.5" }
typstify-search = { path = "crates/typstify-search", version = "0.1.5" }
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
